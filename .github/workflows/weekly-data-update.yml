# Weekly public-data refresh. Opens a pull request; never publishes directly.
# A human reviews and merges. Cloudflare Pages deploys only from the main branch.
name: weekly-data-update

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC
  workflow_dispatch: {}

permissions: {}            # nothing by default; the job below asks for only what it needs

concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # push the update branch
      pull-requests: write   # open the pull request
      actions: write         # start the validate workflow on the new branch
    steps:
      - name: Check out (credentials not stored in .git/config)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run tests before touching anything
        run: python3 -m unittest discover -s tests

      - name: Fetch public data (no secrets available to this step)
        run: python3 scripts/fetch_updates.py

      - name: Validate and compare with the published version
        run: python3 scripts/validate.py --baseline-ref HEAD --report reports/update-report.md

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # git status (not git diff) so new, untracked state files count as a change.
          # Otherwise the baseline in data/state is never saved and new prosecutions are never reported.
          if [ -z "$(git status --porcelain --untracked-files=all -- site/data data/state)" ]; then
            echo "No data changes this week."
            cat reports/update-report.md >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="data/auto-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site/data/data.json data/state
          git commit -m "Weekly data refresh $(date -u +%F)"
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Weekly data refresh $(date -u +%F)" \
            --body-file reports/update-report.md
          # The PR above does not trigger the validate workflow, so start it on the branch.
          gh workflow run validate-pr.yml --ref "$branch"
